<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Akari-AIO Settings</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070b12;
    --bg2: #0c1220;
    --panel: rgba(12, 18, 32, 0.92);
    --text: #e6f4ff;
    --muted: #7f95b5;
    --accent: #00e5c0;
    --accent2: #6c8cff;
    --danger: #ff5c7a;
    --border: rgba(0, 229, 192, 0.18);
    --glow: rgba(0, 229, 192, 0.12);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(900px 400px at 10% -10%, rgba(108, 140, 255, 0.12), transparent 55%),
      radial-gradient(700px 360px at 100% 0%, rgba(0, 229, 192, 0.08), transparent 50%),
      linear-gradient(180deg, var(--bg), var(--bg2));
    color: var(--text);
    padding: 18px 16px 28px;
    max-width: 480px;
    margin-inline: auto;
    min-height: 100vh;
  }
  h1 {
    font-size: 1.2rem;
    margin: 0 0 4px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 700;
  }
  h1 span { color: var(--accent); }
  p.sub { color: var(--muted); font-size: .84rem; margin: 0 0 18px; line-height: 1.4; }
  section {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 14px 12px;
    margin-bottom: 12px;
    box-shadow: 0 0 0 1px rgba(108, 140, 255, 0.04), 0 8px 24px rgba(0, 0, 0, 0.35);
  }
  section h2 {
    font-size: .78rem;
    margin: 0 0 10px;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 600;
  }
  label.row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin: 11px 0;
    cursor: pointer;
    font-size: .92rem;
    line-height: 1.35;
  }
  label.row input {
    margin-top: 3px;
    accent-color: var(--accent);
    width: 16px;
    height: 16px;
  }
  label.row strong {
    font-family: ui-monospace, "Cascadia Code", Consolas, monospace;
    font-size: .88rem;
    color: #c8fff3;
  }
  .hint { display: block; color: var(--muted); font-size: .76rem; margin-top: 3px; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid transparent;
    font-weight: 600;
    font-size: .9rem;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .save {
    background: linear-gradient(135deg, #00c9a8, #2f6bff);
    color: #041018;
    border-color: rgba(0, 229, 192, 0.35);
  }
  .save:hover { filter: brightness(1.08); }
  .close {
    background: rgba(15, 23, 42, 0.9);
    color: var(--text);
    border-color: rgba(148, 163, 184, 0.25);
  }
  .close:hover { border-color: var(--accent2); }
</style>
</head>
<body>
  <h1>Akari<span>-AIO</span> Settings</h1>
  <p class="sub">Performance &amp; voice flags. Module changes apply on reload.</p>

  <section>
    <h2>Performance</h2>
    <label class="row">
      <input type="checkbox" id="noAudioConsole" />
      <span><strong>--no-AudioConsole</strong>
        <span class="hint">Disable wake / mic pipeline (text-only). Wake script → null.</span>
      </span>
    </label>
    <label class="row">
      <input type="checkbox" id="noVideo" />
      <span><strong>--NoVideo</strong>
        <span class="hint">Disable VRM avatar. Avatar script → null.</span>
      </span>
    </label>
  </section>

  <section>
    <h2>Voice pipeline</h2>
    <label class="row">
      <input type="checkbox" id="nonBlockingVad" />
      <span><strong>--non-blocking-VAD</strong>
        <span class="hint">After wake, feed all mic audio to STT. VAD only ends the utterance when you stop talking (does not gate which chunks reach recognition).</span>
      </span>
    </label>
    <label class="row">
      <input type="checkbox" id="thinkingSignal" />
      <span><strong>Play signal when thinking</strong>
        <span class="hint">Marimba loop after transcription starts; fades when speech synthesis begins.</span>
      </span>
    </label>
  </section>

  <section>
    <h2>Sleep</h2>
    <label class="row">
      <input type="checkbox" id="sleepAtNight" />
      <span><strong>Sleep at Night</strong>
        <span class="hint">22:00–06:00 local + 3h fully idle → reload. Voice, text, or pointer resets the timer.</span>
      </span>
    </label>
  </section>

  <div class="actions">
    <button type="button" class="close" id="btnClose">Close</button>
    <button type="button" class="save" id="btnSave">Save &amp; reload</button>
  </div>

<script>
(function () {
  const ls = (k) => localStorage.getItem(k);
  const isOn = (k) => ls(k) === '1' || ls(k) === 'true';

  document.getElementById('noAudioConsole').checked =
    isOn('aio_noAudioConsole') || ls('selectedWakeScript') === 'null' || ls('selectedWakeScript') === 'off';
  document.getElementById('noVideo').checked =
    isOn('aio_noVideo') || ls('selectedAvatarScript') === 'null' || ls('selectedAvatarScript') === 'off';
  document.getElementById('nonBlockingVad').checked = isOn('aio_nonBlockingVad');
  document.getElementById('sleepAtNight').checked = isOn('aio_sleepAtNight');
  document.getElementById('thinkingSignal').checked = isOn('aio_thinkingSignal');

  document.getElementById('btnClose').onclick = function () {
    try {
      if (window.parent && window.parent !== window && window.parent.app && window.parent.app.ui) {
        window.parent.app.ui.closeWindow();
        return;
      }
    } catch (_) {}
    history.back();
  };

  document.getElementById('btnSave').onclick = function () {
    const noAC = document.getElementById('noAudioConsole').checked;
    const noVid = document.getElementById('noVideo').checked;
    const nbVad = document.getElementById('nonBlockingVad').checked;
    const sleep = document.getElementById('sleepAtNight').checked;
    const signal = document.getElementById('thinkingSignal').checked;

    localStorage.setItem('aio_noAudioConsole', noAC ? '1' : '0');
    localStorage.setItem('aio_noVideo', noVid ? '1' : '0');
    localStorage.setItem('aio_nonBlockingVad', nbVad ? '1' : '0');
    localStorage.setItem('aio_sleepAtNight', sleep ? '1' : '0');
    localStorage.setItem('aio_thinkingSignal', signal ? '1' : '0');

    localStorage.setItem('selectedWakeScript', noAC ? 'null' : './engine/audioConsole.js');
    localStorage.setItem('selectedAvatarScript', noVid ? 'null' : './characters/akari/VRM4.js');

    try {
      if (window.parent && window.parent !== window) {
        window.parent.location.reload();
        return;
      }
    } catch (_) {}
    location.href = './';
  };
})();
</script>
</body>
</html>
